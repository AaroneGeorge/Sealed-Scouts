[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# The diana EVM runs Cancun opcodes (PUSH0, MCOPY and TSTORE checked with eth_call on 19 Nov).
evm_version = "cancun"
# Tests read the shared vectors; the deploy script writes deployments/diana.json.
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "../fixtures" },
  { access = "read-write", path = "../deployments" },
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[lint]
# Reviewed on 19 Nov. Timestamps are the design (challenge window, exit delay, staleness). Packed encodings build fixed
# signed texts with separators and are never hashed for uniqueness. Casts are bounded (timestamps, counts <= 255).
# Native-coin payouts go only to the challenger or to a payee signed for by the bond owner's ML-DSA-87 key.
exclude_lints = [
  "block-timestamp",
  "encode-packed-collision",
  "unsafe-typecast",
  "require-revert-in-loop",
  "uninitialized-local",
  "arbitrary-send-eth",
]
